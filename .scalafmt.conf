version = "3.11.5"
runner.dialect = scala213
style = default
docstrings.style = Asterisk
docstrings.wrap = no
maxColumn = 160
indent.defnSite = 2
includeCurlyBraceInSelectChains = false
assumeStandardLibraryStripMargin = true

# sbt 2 compiles build definitions with Scala 3.
fileOverride {
  "glob:**.sbt" {
    runner.dialect = scala3
  }
  "glob:**/project/*.scala" {
    runner.dialect = scala3
  }
}

align.tokens."+" = [
  "<-", #Try to align simple for blocks for readability
  "//", #If you have many `//` on the end of lines next to each other, try and align them for readability
  {code = "%", owner = "Term.ApplyInfix"}, #SBT specific stuff. Format the dependencies in a way that makes them more readable.
  {code = "%%", owner = "Term.ApplyInfix"},
  {code = "%%%", owner = "Term.ApplyInfix"}
]

rewrite.rules = [
  AvoidInfix
  RedundantBraces
  RedundantParens
  AsciiSortImports
  PreferCurlyFors
]

rewrite.avoidInfix.excludeFilters = [
  until
  to
  by
  eq
  ne
  "should.*"
  "contain.*"
  "must.*"
  in
  be
  taggedAs
  thrownBy
  synchronized
  have
  when
  size
  theSameElementsAs
  # Spire's field and group operations read as math, and the curve arithmetic below is unreadable in
  # method-call form.
  pow
  mod
  "\\*\\*"
]
