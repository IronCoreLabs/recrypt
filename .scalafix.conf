// Replaces the code-smell checks scalastyle used to enforce. Formatting, line length and whitespace are
// scalafmt's (.scalafmt.conf). These have no scalafix equivalent and are no longer checked: naming,
// method and file length, parameter count, cyclomatic complexity, equals/hashCode pairing, covariant
// equals, boolean simplification, and declaring a clone() method.
rules = [
  DisableSyntax
  LeakingImplicitClassVal
  NoAutoTupling
  NoValInForComprehension
  ProcedureSyntax
  RedundantSyntax
  OrganizeImports
]

DisableSyntax {
  noNulls = true
  noReturns = true
  noFinalize = true
  noTabs = true

  regex = [
    {
      id = "noPrintln"
      pattern = "(?<!\\.)\\bprintln\\b"
      message = "Don't use println; return a value or use a logger."
    }
    {
      id = "noTripleQuestion"
      pattern = "\\?\\?\\?"
      message = "??? left in code; finish the implementation."
    }
    {
      id = "uppercaseL"
      pattern = "\\b\\d+l\\b"
      message = "Use uppercase L for Long literals (e.g. 100L not 100l)."
    }
    {
      id = "todoComment"
      pattern = "(?i)\\b(TODO|FIXME)\\b"
      message = "Resolve TODO/FIXME before merging."
    }
    {
      id = "noSunImport"
      pattern = "import\\s+sun\\."
      message = "Don't import from sun.*"
    }
    {
      id = "noAwtImport"
      pattern = "import\\s+java\\.awt\\."
      message = "Don't import from java.awt.*"
    }
  ]
}

OrganizeImports {
  removeUnused = true
  groupedImports = Merge
  expandRelative = true
  targetDialect = Scala2
}
